/* Si el celular abre la página en "modo computadora" (iPhone con "Solicitar sitio web de escritorio"),
   la agranda para que ocupe el ancho de la pantalla como una app. */
(function(){
  function fit(){
    var de=document.documentElement;de.style.zoom='';
    var sw=Math.min(screen.width,screen.height),touch=(navigator.maxTouchPoints||0)>0;
    var lw=de.clientWidth||window.innerWidth;
    if(touch&&sw<700&&lw>sw*1.3){var portrait=window.innerHeight>=window.innerWidth;var w=portrait?sw:Math.max(screen.width,screen.height);de.style.zoom=(lw/w).toFixed(3);de.classList.add('zoomfit')}
  }
  fit();addEventListener('orientationchange',function(){setTimeout(fit,300)});addEventListener('resize',function(){clearTimeout(window.__f);window.__f=setTimeout(fit,200)});
})();
</script>

<script type="module">
/* =========================================================
   1) CONFIGURACIÓN — pegá acá lo que te da Firebase
   (Configuración del proyecto › Tus apps › SDK › Config).
   Mientras diga PEGAR_ACA la app funciona en MODO DEMO

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBgPZci897JBV410C0GFE3299uX_un4g4s",
  authDomain: "nido38.firebaseapp.com",
  projectId: "nido38",
  storageBucket: "nido38.firebasestorage.app",

};

const N = {G:'Gonza', D:'Dani'};

/* Gastos fijos del mes: categorías y conceptos iniciales (el presupuesto se edita desde la app) */
const CATS = [
  {id:'hogar', ic:'🏠', col:'#0f7b5f', name:'Hogar',        items:['Expensas ordinarias','Expensas extraordinarias','Préstamo hipotecario','Fichas de lavado']},
  {id:'imp',   ic:'🧾', col:'#d97706', name:'Impuestos y servicios', items:['Municipalidad','Luz','Gas','ARBA','Flow']},
  {id:'super', ic:'🛒', col:'#2563eb', name:'Supermercado', items:['Supermercado','Carne','Huevos','Pollo','Verdura','Fiambre','Otros']},
  {id:'tomy',  ic:'🐱', col:'#db2777', name:'Tomy',         items:['Comida','Piedritas','Veterinario','Filtros','Otros gastos']},
  {id:'otros', ic:'📦', col:'#6b7280', name:'Otros',        items:['Otros']},
];
/* Gastos extra (fuera del presupuesto mensual) */
const XCATS = [
  {id:'tarjeta', ic:'💳', col:'#7c3aed', name:'Tarjeta'},
  {id:'salidas', ic:'🍽️', col:'#ea580c', name:'Salidas y comidas'},
  {id:'gustos',  ic:'🍦', col:'#ec4899', name:'Gustitos'},
  {id:'viajes',  ic:'✈️', col:'#0891b2', name:'Viajes y paseos'},
  {id:'regalos', ic:'🎁', col:'#dc2626', name:'Regalos'},
  {id:'xotros',  ic:'✨', col:'#6b7280', name:'Otros'},
];
const DEFAULT_ITEMS = CATS.flatMap(c => c.items.map(name => ({cat:c.id, name, est:0})));
const catOf = id => CATS.find(c=>c.id===id) || XCATS.find(c=>c.id===id) || CATS[CATS.length-1];
const ciHtml = c => `<div class="ci" style="background:${XCATS.includes(c)||XCATS.some(x=>x.id===c.id)?'var(--golds)':'var(--acs)'}">${c.ic}</div>`;

/* ---------- utilidades ---------- */
const money = n => {n=Math.round((n||0)*100)/100;const dec=n%1!==0;return new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',minimumFractionDigits:dec?2:0,maximumFractionDigits:2}).format(n)};
function parseAmt(s){s=String(s??'').replace(/[\s$]/g,'');if(!s)return NaN;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');const v=Number(s);return isFinite(v)?Math.round(v*100)/100:NaN}
const fmtIn = n => n ? String(n).replace('.',',') : '';
const pad = n => String(n).padStart(2,'0');
const ymOf = d => d.getFullYear()+'-'+pad(d.getMonth()+1);
const today = () => {const d=new Date();return ymOf(d)+'-'+pad(d.getDate())};
const mIdx = s => {const[y,m]=s.split('-').map(Number);return y*12+m-1};
const mFrom = i => Math.floor(i/12)+'-'+pad(i%12+1);
const cap = t => t[0].toUpperCase()+t.slice(1);
const mLabel = s => {const[y,m]=s.split('-').map(Number);return cap(new Date(y,m-1,1).toLocaleDateString('es-AR',{month:'long'}))+' '+y};
const mShort = s => {const[y,m]=s.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('es-AR',{month:'short',year:'2-digit'})};
const dLabel = s => {const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('es-AR',{day:'numeric',month:'short'})};
const dLong = s => {const[y,m,d]=s.split('-').map(Number);return cap(new Date(y,m-1,d).toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'}))};
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = s => document.querySelector(s);
const lsGet = k => {try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet = (k,v) => {try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
const pct = (a,b) => b>0 ? Math.max(0,Math.min(100,a/b*100)) : (a>0?100:0);
const av = (w,lg) => `<span class="av ${w}${lg?' lg':''}">${N[w][0]}</span>`;
function toast(t){document.querySelectorAll('.toast').forEach(x=>x.remove());const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),3000)}

/* =========================================================
   2) ALMACENAMIENTO: Firebase (real) o localStorage (demo)
   ========================================================= */
const DEMO = !FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey === 'PEGAR_ACA';

function demoStore(){
  const KEY='gastos-demo-v1';let data;try{data=JSON.parse(lsGet(KEY))||{}}catch(e){data={}}
  const subs={};const save=()=>lsSet(KEY,JSON.stringify(data));
  const emit=c=>(subs[c]||[]).forEach(cb=>cb(Object.entries(data[c]||{}).map(([id,v])=>({id,...v}))));
  return{
    sub(c,cb){(subs[c]=subs[c]||[]).push(cb);setTimeout(()=>emit(c),0)},
    async set(c,id,v){(data[c]=data[c]||{})[id]=JSON.parse(JSON.stringify(v));save();emit(c)},
    async del(c,id){if(data[c])delete data[c][id];save();emit(c)},
    async get(c,id){return data[c]?.[id]||null}
  };
}
async function fireStore(){
  const V='11.0.2',B=`https://www.gstatic.com/firebasejs/${V}/`;
  const [{initializeApp},A,F]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
  const app=initializeApp(FIREBASE_CONFIG);
  const auth=A.getAuth(app);
  let db;try{db=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})})}catch(e){db=F.getFirestore(app)}
  return{auth,A,
    sub(c,cb,err){return F.onSnapshot(F.collection(db,c),s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))),err)},
    set:(c,id,v)=>F.setDoc(F.doc(db,c,id),v),
    del:(c,id)=>F.deleteDoc(F.doc(db,c,id)),
    get:async(c,id)=>{const s=await F.getDoc(F.doc(db,c,id));return s.exists()?s.data():null}
  };
}

/* =========================================================
   3) CÁLCULOS
   Un gasto es "fijo" (presupuesto del mes) o "extra".
   Los extras pueden ir en cuotas: "monto" es el valor de cada cuota
   y se repite n meses desde el mes de la fecha.
   bal > 0  →  Dani le debe a Gonza;  bal < 0  →  Gonza le debe a Dani
   ========================================================= */
const tipoOf = g => g.tipo==='extra'?'extra':'fijo';
const isA = g => g.pago==='A';   /* aproximado: todavía no lo pagó nadie */
const nOf = g => Math.max(1,Math.min(60,g.n||1));
const startM = g => g.fecha.slice(0,7);
const shareG = g => g.para==='G'?g.monto:g.para==='D'?0:g.monto/2;
const netOf = g => isA(g)?0:(g.pago==='G'?g.monto:0) - shareG(g);
const sig = p => (p.from==='D'?-1:1)*p.monto;

const settledOf = g => pagos.find(p=>p.gasto===g.id&&(p.k||1)===(g.k||1));
function occIn(m){
  const out=[];
  gastos.forEach(g=>{const off=mIdx(m)-mIdx(startM(g));if(off>=0&&off<nOf(g))out.push({...g,k:off+1})});
  return out;
}
function budgetFor(m){
  const own=meses.find(x=>x.id===m);if(own)return{items:own.items||[],src:'own'};
  const prev=meses.filter(x=>x.id<m).sort((a,b)=>b.id.localeCompare(a.id))[0];
  if(prev)return{items:(prev.items||[]).map(i=>({...i,aprox:!!i.est})),src:'prev',from:prev.id};
  return{items:DEFAULT_ITEMS,src:'default'};
}
function monthData(m){
  const L=occIn(m), F=L.filter(g=>tipoOf(g)==='fijo'), X=L.filter(g=>tipoOf(g)==='extra');
  const paid={G:0,D:0},paidF={G:0,D:0},paidX={G:0,D:0};
  L.forEach(g=>{if(isA(g))return;paid[g.pago]+=g.monto;(tipoOf(g)==='fijo'?paidF:paidX)[g.pago]+=g.monto});
  const sum=(arr,f)=>arr.reduce((a,x)=>a+f(x),0);
  const apxF=sum(F.filter(isA),g=>g.monto), apxX=sum(X.filter(isA),g=>g.monto);
  const totF=paidF.G+paidF.D, totX=paidX.G+paidX.D;
  const sets=pagos.filter(p=>p.mes===m), setsX=sets.filter(p=>p.tipo==='extra');
  /* fijos: diferencia 50/50 del mes (solo informativa, sin saldar) */
  const balF=sum(F,netOf)+sum(sets.filter(p=>p.tipo!=='extra'),sig);
  /* extras: saldo del mes + lo pendiente de extras de meses anteriores */
  let carryX=0;
  gastos.forEach(g=>{if(tipoOf(g)!=='extra')return;const k=Math.max(0,Math.min(nOf(g),mIdx(m)-mIdx(startM(g))));carryX+=netOf(g)*k});
  pagos.forEach(p=>{if(p.tipo==='extra'&&p.mes<m)carryX+=sig(p)});
  const balX=carryX+sum(X,netOf)+sum(setsX,sig);
  const bud=budgetFor(m);
  const est=sum(bud.items,i=>i.est||0);
  /* fijos: real vs estimado por concepto */
  const key=(c,n)=>c+'|'+String(n).trim().toLowerCase();
  const real={},apx={};F.forEach(g=>{const k=key(g.cat,g.concepto);const o=isA(g)?apx:real;o[k]=(o[k]||0)+g.monto});
  const cats=CATS.map(c=>{
    const rows=bud.items.filter(i=>i.cat===c.id).map(i=>{const k=key(c.id,i.name);return{name:i.name,est:i.est||0,aprox:!!i.aprox&&!!i.est,real:real[k]||0,apx:apx[k]||0}});
    const known=new Set(rows.map(r=>key(c.id,r.name)));
    F.filter(g=>catOf(g.cat).id===c.id).forEach(g=>{const k=key(c.id,g.concepto);if(!known.has(k)){known.add(k);rows.push({name:g.concepto,est:0,real:real[k]||0,apx:apx[k]||0,extra:true})}});
    return{...c,rows,est:sum(rows,r=>r.est),real:sum(rows,r=>r.real),apx:sum(rows,r=>r.apx),aprox:rows.some(r=>r.aprox)};
  });
  /* total previsto: en cada concepto fijo, lo mayor entre lo estimado y lo cargado */
  const previstoF=sum(cats,c=>sum(c.rows,r=>Math.max(r.est,r.real+r.apx)));
  const previsto=previstoF+totX+apxX, pagado=totF+totX;
  const xcats=XCATS.map(c=>{const G=X.filter(g=>catOf(g.cat).id===c.id);return{...c,real:sum(G.filter(g=>!isA(g)),g=>g.monto),apx:sum(G.filter(isA),g=>g.monto)}}).filter(c=>c.real+c.apx>0).sort((a,b)=>(b.real+b.apx)-(a.real+a.apx));
  const aprox=bud.items.some(i=>i.aprox&&i.est);
  return{L,F,X,paid,paidF,paidX,totF,totX,apxF,apxX,total:pagado,previsto,pagado,balF,balX,carryX,sets,setsX,bud,est,aprox,cats,xcats};
}

function topBar(){
  return `<div class="top"><div class="mnav"><button data-m="-1" aria-label="Mes anterior">‹</button><span>${mLabel(month)}</span><button data-m="1" aria-label="Mes siguiente">›</button></div><button class="who" id="who" aria-label="${N[me]}">${av(me)}<span class="wn">${N[me]}</span></button></div>`;
}
function render(force){
  const app=$('#app');
  if(!force&&tab==='pres'&&document.activeElement?.closest?.('#pres')){pendingRender=true;return}
  pendingRender=false;
  const nav=$('#nav');if(nav)nav.remove();
  if(phase==='loading'){app.innerHTML='<div class="empty">Cargando…</div>';return}
  if(phase==='error'){app.innerHTML=`<div class="center"><h2>Ups</h2><p class="lbl">${esc(errMsg)}</p>${user?'<button class="btn sec" id="out">Salir</button>':''}</div>`;const o=$('#out');if(o)o.onclick=logout;return}
  if(phase==='login')return renderLogin(app);
  if(phase==='verify')return renderVerify(app);
  if(!(got.g&&got.p&&got.m)){app.innerHTML='<div class="empty">Cargando datos…</div>';return}
  if(!me){app.innerHTML=`<div class="center"><div style="font-size:48px">👋</div><h2>¿Quién sos?</h2><p class="lbl">Se guarda en este teléfono.</p><button class="btn" data-w="G" style="background:var(--g)">Soy Gonza</button><button class="btn" data-w="D" style="background:var(--d)">Soy Dani</button></div>`;
    app.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{me=b.dataset.w;lsSet('gastos-who',me);render()});return}

  const d=monthData(month);
  let h=DEMO?'<div class="demo">Modo demo: los datos quedan solo en este teléfono.</div>':'';
  if(tab==='res')h+=resHtml(d);
  else{h+=topBar();h+=tab==='fij'?fijHtml(d):tab==='ext'?extHtml(d):presHtml(d)}
  if(tab==='ext')h+=`<button class="fab x" id="add">+ Extra</button>`;
  else if(tab!=='pres')h+=`<button class="fab" id="add">+ Gasto</button>`;
  app.innerHTML=h;
  const n=document.createElement('nav');n.className='nav';n.id='nav';
  n.innerHTML='<div>'+[['res','📊','Resumen'],['fij','🧾','Fijos'],['ext','🍦','Extras'],['pres','📝','Presupuesto']].map(t=>`<button data-t="${t[0]}" class="${tab===t[0]?'on':''}"><i>${t[1]}</i>${t[2]}</button>`).join('')+'</div>';
  document.body.appendChild(n);
  bindMain(d);
}

function brandHtml(){return `<div class="brand"><img src="brand.png" alt=""><div><span>Nido</span><small>FINANZAS DEL HOGAR</small></div></div>`}
function whoOwes(b){return {deb:b>0?'D':'G',cred:b>0?'G':'D',amt:Math.abs(b)}}
function resHtml(d){
  const half=d.est/2,falta=Math.max(0,d.previsto-d.pagado);
  let h=`<div class="hero">${brandHtml()}${topBar()}<div class="k">Total previsto del mes</div><div class="v num">${money(d.previsto)}</div>`;
  h+=`<div class="bar"><i style="width:${pct(d.pagado,d.previsto)}%"></i></div><div class="s">Pagado ${money(d.pagado)} · Falta ${money(falta)}</div></div>`;
  h+=`<div class="two">${['G','D'].map(w=>`<div class="card"><div class="pp">${av(w,1)}<span>${N[w]}</span></div><div class="lbl">Pagó</div><div class="big num">${money(d.paid[w])}</div><span class="sub">Fijos ${money(d.paidF[w])} · Extras ${money(d.paidX[w])}</span></div>`).join('')}</div>`;
  /* fijos */
  const overF=d.est>0&&d.totF>d.est;
  h+=`<div class="card"><div class="ttl"><b>🧾 Gastos fijos</b><button class="link" data-go="fij">Ver ›</button></div>`;
  h+=`<div style="display:flex;justify-content:space-between;align-items:baseline"><span class="big num">${money(d.totF)}</span><span class="lbl num ${d.aprox?'aprox':''}">de ${d.aprox?'≈ ':''}${money(d.est)}</span></div><div class="bar"><i style="width:${pct(d.totF,d.est)}%"></i></div>`;
  h+=`<div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px"><span class="lbl ${d.aprox?'aprox':''}">Cada uno pone ${d.aprox?'≈ ':''}${money(half)}</span><span class="${overF?'over':'lbl'}">${d.est>0?(overF?'Se pasaron '+money(d.totF-d.est):'Faltan '+money(d.est-d.totF)):''}</span></div>`;
  if(d.apxF)h+=`<div class="hint aprox">≈ ${money(d.apxF)} cargados como aproximados (sin pagar)</div>`;
  const f=whoOwes(d.balF);
  if(d.totF>0)h+=f.amt>=0.5?`<div class="info">⚖️ Para quedar 50/50 en fijos, <b>${N[f.deb]} le pasa ${money(f.amt)} a ${N[f.cred]}</b></div>`:`<div class="info">⚖️ Fijos parejos 50/50 ✓</div>`;
  h+=d.cats.filter(c=>c.rows.length).map(c=>{
    const over=c.est>0&&c.real>c.est;
    return `<details class="cat" data-cat="${c.id}" ${openCats.has(c.id)?'open':''}><summary>${ciHtml(c)}<div style="flex:1;min-width:0"><div class="ch"><span>${esc(c.name)}</span><span class="num ${over?'over':''}">${money(c.real)} <span class="lbl ${c.aprox?'aprox':''}">/ ${c.aprox?'≈ ':''}${money(c.est)}</span></span></div><div class="bar sm ${over?'red':''}"><i style="width:${pct(c.real,c.est)}%"></i></div></div><span class="chev">›</span></summary>`+
      c.rows.map(r=>{const st=r.real===0?'':r.est>0&&r.real>r.est?'over':r.est>0&&r.real>=r.est?'done':'';
        return `<div class="cr"><span class="n">${st==='done'?'✓ ':''}${esc(r.name)}${r.extra?' <span class="lbl">(sin estimar)</span>':''}${r.apx?` <span class="aprox" style="font-size:13px">+≈${money(r.apx)}</span>`:''}</span><span class="v num"><b class="${st}">${r.real?money(r.real):'—'}</b> / <span class="${r.aprox?'aprox':''}">${r.aprox?'≈ ':''}${money(r.est)}</span></span><button class="ic plus" data-q="${c.id}" data-qn="${esc(r.name)}" aria-label="Cargar ${esc(r.name)}">+</button></div>`}).join('')+`</details>`}).join('');
  if(d.aprox)h+=`<div class="hint aprox" style="margin-top:8px">≈ Montos en gris: aproximados, copiados del mes pasado. Corregilos en Presupuesto.</div>`;
  h+=`</div>`;
  /* extras: acá sí se salda */
  h+=`<div class="xcard"><div class="ttl" style="margin-bottom:2px"><b style="color:#3a2806">🍦 Extras</b><button class="link" data-go="ext" style="color:#3a2806">Ver ›</button></div>`;
  h+=`<div class="big num">${money(d.totX)}</div>${d.apxX?`<div class="k">+ ≈ ${money(d.apxX)} aproximados</div>`:''}`;
  if(!d.X.length)h+=`<div class="k" style="margin-top:4px">Tarjeta, cenas, helados… lo que no es del presupuesto fijo.</div><button class="xb2" id="addx">+ Cargar un extra</button>`;
  h+=settleXHtml(d)+`</div>`;
  return h;
}
function settleXHtml(d){
  const x=whoOwes(d.balX);
  if(x.amt>=0.5)return `<div style="margin-top:12px;font-size:17.5px;font-weight:800">${N[x.deb]} le da ${money(x.amt)} a ${N[x.cred]}</div>${Math.abs(d.carryX)>=0.5?`<div class="k">Incluye ${money(Math.abs(d.carryX))} pendiente de meses anteriores</div>`:''}<button class="xb2" id="settlex">🤝 Saldar extras</button>`;
  return d.X.some(g=>!isA(g))?`<div style="margin-top:10px;font-weight:800">Extras saldados ✓</div>`:'';
}

function listByDay(L,rowFn){
  const by={};L.forEach(g=>{(by[g.fecha]=by[g.fecha]||[]).push(g)});
  return Object.keys(by).sort().reverse().map(f=>`<div class="dayh">${dLong(f)}</div>`+by[f].map(rowFn).join('')).join('');
}
function filtHtml(){return `<div class="seg" style="margin-bottom:10px">${[['all','Todos'],['G','Gonza'],['D','Dani'],['A','≈ Aprox.']].map(o=>`<button data-f="${o[0]}" class="${filt===o[0]?'on':''}">${o[1]}</button>`).join('')}</div>`}
function fijHtml(d){
  let L=d.F;if(filt!=='all')L=L.filter(g=>g.pago===filt);
  let h=`<div class="card"><div class="ttl"><b>Gastos fijos</b><span class="pill num">${money(d.totF)} / ${money(d.est)}</span></div><div class="bar ${d.est>0&&d.totF>d.est?'red':''}" style="margin:0"><i style="width:${pct(d.totF,d.est)}%"></i></div></div>`;
  h+=filtHtml();
  h+=`<div class="card">${L.length?listByDay(L,rowG):'<div class="empty">No hay gastos fijos cargados.<br>Tocá “+ Gasto” o el “+” de un concepto en Resumen.</div>'}</div>`;
  if(d.L.length)h+=`<button class="link" id="csv">⬇ Exportar ${mLabel(month)} (para Excel)</button>`;
  return h;
}
function extHtml(d){
  let L=d.X;if(filt!=='all')L=L.filter(g=>g.pago===filt);
  let h=`<div class="xcard"><div class="k">Extras de ${mLabel(month).toLowerCase()}</div><div class="big num" style="font-size:30px">${money(d.totX)}</div><div class="k">${N.G} pagó ${money(d.paidX.G)} · ${N.D} pagó ${money(d.paidX.D)}${d.apxX?` · ≈ ${money(d.apxX)} a pagar`:''}</div>`+settleXHtml(d)+`</div>`;
  h+=filtHtml();
  h+=`<div class="card">${L.length?listByDay(L,rowG):'<div class="empty">Sin extras este mes.<br>Cargá la tarjeta, una cena, un helado…</div>'}</div>`;
  if(d.setsX.length)h+=`<div class="card"><div class="ttl"><b>Pagos de extras</b></div>${d.setsX.map(rowP).join('')}</div>`;
  if(d.L.length)h+=`<button class="link" id="csv">⬇ Exportar ${mLabel(month)} (para Excel)</button>`;
  return h;
}
function rowG(g){
  const c=catOf(g.cat),n=nOf(g),A=isA(g);
  const sub=A?['<b class="aprox" style="display:inline;font-size:inherit">≈ aproximado, sin pagar</b>']:[`${av(g.pago)} ${N[g.pago]}`.replace('class="av','style="width:16px;height:16px;font-size:9px;display:inline-grid;vertical-align:-3px" class="av'),g.para==='ambos'?'50/50':'solo '+N[g.para]];
  if(g.nota)sub.push(esc(g.nota));
  const X=tipoOf(g)==='extra',st=X&&!A&&settledOf(g),canS=X&&!A&&!st&&Math.abs(netOf(g))>=0.5;
  if(st)sub.unshift('<b style="color:var(--ac);display:inline;font-size:inherit">✓ saldado</b>');
  return `<div class="row tap" data-edit="${esc(g.id)}" role="button" aria-label="Ver o editar ${esc(g.concepto)}">${ciHtml(c)}<div class="rt"><b class="${A?'aprox':''}">${esc(g.concepto)}${g.foto?' <span style="display:inline;font-size:14px">📎</span>':''}</b><span>${sub.join(' · ')}</span></div><div class="am num ${A?'aprox':''}">${A?'≈ ':''}${money(g.monto)}${n>1?`<small>cuota ${g.k}/${n}</small>`:''}</div>${canS?`<button class="ic sbtn" data-sg="${esc(g.id)}" data-sk="${g.k||1}" aria-label="Saldar este gasto">🤝</button>`:''}</div>`;
}
function rowP(p){
  return `<div class="row"><div class="ci" style="background:var(--acs)">🤝</div><div class="rt"><b>${N[p.from]} le pagó a ${N[p.to]}</b><span>${dLabel(p.fecha)}${p.desc?' · '+esc(p.desc):''}</span></div><div class="am pos num">${money(p.monto)}</div>${p.foto?`<button class="ic" data-foto="${esc(p.foto)}" aria-label="Ver comprobante">📎</button>`:''}${delBtn('p:'+p.id)}</div>`;
}
function delBtn(k,cuotas){return `<button class="ic ${armed===k?'arm':''}" data-del="${esc(k)}" aria-label="Borrar">${armed===k?(cuotas?'¿Borrar todas las cuotas?':'¿Borrar?'):'✕'}</button>`}

function presHtml(d){
  if(draftMonth!==month){draft=JSON.parse(JSON.stringify(d.bud.items));draftMonth=month}
  const t=draft.reduce((a,i)=>a+(i.est||0),0);
  const anyA=draft.some(i=>i.aprox&&i.est);
  const src=d.bud.src==='prev'?`Copiado de ${mLabel(d.bud.from)}. Guardalo para fijarlo en este mes.`:d.bud.src==='default'?'Valores iniciales: cargá los estimados y guardá.':'';
  let h=`<div id="pres"><div class="hero" style="padding:16px"><div class="k">Presupuesto de gastos fijos</div><div class="v num" id="ptot">${money(t)}</div><div class="s" id="phalf">Cada uno pone ${money(t/2)}</div>${src?`<div class="s" style="margin-top:6px">${src}</div>`:''}${anyA?`<div class="s" style="margin-top:6px">Los montos en gris son aproximados (del mes pasado). Tocá uno para corregirlo, o confirmalos todos.</div><button class="hb" id="pconf">✓ Confirmar todos</button>`:''}</div>`;
  CATS.forEach(c=>{
    h+=`<div class="card"><div class="pp">${ciHtml(c)}<b>${esc(c.name)}</b></div>`;
    draft.forEach((it,i)=>{if(it.cat!==c.id)return;h+=`<div class="pr"><input type="text" class="nm" data-pi="${i}" data-pf="name" value="${esc(it.name)}" placeholder="Concepto"><input type="text" class="es num ${it.aprox&&it.est?'aprox':''}" inputmode="decimal" data-pi="${i}" data-pf="est" value="${fmtIn(it.est)}" placeholder="$ 0"><button class="ic" data-prm="${i}" aria-label="Quitar">✕</button></div>`});
    h+=`<button class="link" data-padd="${c.id}">+ Agregar concepto</button></div>`;
  });
  h+=`<div class="acts" style="margin-bottom:8px"><button class="btn" id="psave">Guardar presupuesto de ${mLabel(month)}</button></div><p class="hint" style="text-align:center">Los meses siguientes sin presupuesto propio copian este. Los extras no van acá.</p></div>`;
  return h;
}

function bindMain(d){
  const qa=s=>document.querySelectorAll(s);
  qa('[data-m]').forEach(x=>x.onclick=()=>{month=mFrom(mIdx(month)+Number(x.dataset.m));render(true)});
  qa('[data-t]').forEach(x=>x.onclick=()=>{tab=x.dataset.t;filt='all';render(true);scrollTo(0,0)});
  qa('[data-go]').forEach(x=>x.onclick=()=>{tab=x.dataset.go;filt='all';render(true);scrollTo(0,0)});
  $('#who').onclick=openMenu;
  const add=$('#add');if(add)add.onclick=()=>openGasto(null,{tipo:tab==='ext'?'extra':'fijo'});
  const addx=$('#addx');if(addx)addx.onclick=()=>openGasto(null,{tipo:'extra'});
  const sb=$('#settle');if(sb)sb.onclick=()=>openSettle(d.bal>0?'D':'G',d.bal>0?'G':'D',Math.abs(d.bal));
  const sx=$('#settlex');if(sx)sx.onclick=()=>openSettle(d.balX>0?'D':'G',d.balX>0?'G':'D',Math.abs(d.balX),{tipo:'extra',desc:'extras del mes'});
  qa('[data-sg]').forEach(x=>x.onclick=e=>{e.stopPropagation();const g=d.X.find(o=>o.id===x.dataset.sg&&String(o.k||1)===x.dataset.sk);if(!g)return;const n=netOf(g);openSettle(n>0?'D':'G',n>0?'G':'D',Math.abs(n),{tipo:'extra',gasto:g.id,k:g.k||1,desc:g.concepto+(nOf(g)>1?` (cuota ${g.k}/${nOf(g)})`:'')})});
  qa('details.cat').forEach(x=>x.ontoggle=()=>{x.open?openCats.add(x.dataset.cat):openCats.delete(x.dataset.cat)});
  qa('[data-q]').forEach(x=>x.onclick=e=>{e.preventDefault();const r=d.cats.find(c=>c.id===x.dataset.q).rows.find(r=>r.name===x.dataset.qn);openGasto(null,{tipo:'fijo',cat:x.dataset.q,concepto:x.dataset.qn,monto:r&&r.est>r.real?r.est-r.real:0})});
  qa('[data-f]').forEach(x=>x.onclick=()=>{filt=x.dataset.f;render(true)});
  qa('[data-edit]').forEach(x=>x.onclick=()=>openGasto(gastos.find(g=>g.id===x.dataset.edit)));
  qa('[data-del]').forEach(x=>x.onclick=()=>delItem(x.dataset.del));
  qa('[data-foto]').forEach(x=>x.onclick=()=>showFoto(x.dataset.foto));
  const csv=$('#csv');if(csv)csv.onclick=()=>exportCsv(d);
  const pres=$('#pres');
  if(pres){
    const totals=()=>{const t=draft.reduce((a,i)=>a+(i.est||0),0);$('#ptot').textContent=money(t);$('#phalf').textContent='Cada uno pone '+money(t/2)};
    pres.querySelectorAll('[data-pi]').forEach(x=>{
      x.oninput=()=>{const it=draft[+x.dataset.pi];if(x.dataset.pf==='name')it.name=x.value;else{it.est=parseAmt(x.value)||0;it.aprox=false;x.classList.remove('aprox');totals()}};
      x.onblur=()=>setTimeout(()=>{if(pendingRender&&!document.activeElement?.closest?.('#pres'))render()},0);
    });
    const pc=$('#pconf');if(pc)pc.onclick=()=>{draft.forEach(i=>i.aprox=false);render(true)};
    pres.querySelectorAll('[data-prm]').forEach(x=>x.onclick=()=>{draft.splice(+x.dataset.prm,1);render(true)});
    pres.querySelectorAll('[data-padd]').forEach(x=>x.onclick=()=>{const c=x.dataset.padd;let at=-1;draft.forEach((it,i)=>{if(it.cat===c)at=i});const it={cat:c,name:'',est:0};const pos=at<0?draft.length:at+1;draft.splice(pos,0,it);render(true);setTimeout(()=>{const el=document.querySelector(`[data-pi="${pos}"][data-pf="name"]`);el&&el.focus()},0)});
    $('#psave').onclick=()=>{
      const items=draft.map(i=>({cat:i.cat,name:i.name.trim(),est:i.est||0,...(i.aprox&&i.est?{aprox:true}:{})})).filter(i=>i.name);
      document.activeElement?.blur?.();
      write(store.set('meses',month,{items,por:me,actualizado:new Date().toISOString()}),'Presupuesto guardado ✓');
      draftMonth=null;tab='res';render(true);scrollTo(0,0);
    };
  }
}

async function delItem(k){
  if(armed!==k){armed=k;render(true);setTimeout(()=>{if(armed===k){armed=null;render()}},3500);return}
  armed=null;const t=k[0],id=k.slice(2);
  const o=(t==='g'?gastos:pagos).find(x=>x.id===id);
  write(store.del(t==='g'?'gastos':'pagos',id));
  if(o?.foto)write(store.del('fotos',o.foto));
  toast('Borrado');
}

/* ---------- hojas ---------- */
function sheet(html){
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML='<div class="sheet">'+html+'</div>';
  ov.addEventListener('click',e=>{if(e.target===ov)ov.remove()});
  $('#layer').appendChild(ov);return ov;
}
function seg(el,opts,val,cb){
  el.classList.add('seg');el.innerHTML=opts.map(o=>`<button type="button" data-v="${esc(o[0])}" class="${o[0]===val?'on':''}">${o[1]}</button>`).join('');
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>{el.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));cb(b.dataset.v)});
}

function openGasto(old,pre={}){
  const ed=!!old;
  let tipo=old?tipoOf(old):(pre.tipo||'fijo');
  let pago=old?.pago||me, para=old?.para||'ambos';
  let cat=old?.cat||pre.cat||(tipo==='extra'?'tarjeta':'super'), concepto=old?.concepto||pre.concepto||'';
  let fotoFile=null, quitarFoto=false;
  const preMonto=ed?old.monto:pre.monto;
  const ov=sheet(`<h2>${ed?'Editar gasto':'Nuevo gasto'}</h2>
  <div class="f"><div id="tp" class="tipo"></div></div>
  <div class="f"><label id="al">Monto</label><input class="amt num" id="a" type="text" inputmode="decimal" autocomplete="off" placeholder="0" value="${fmtIn(preMonto)}"><div class="hint" id="ah"></div></div>
  <div class="f"><label>Categoría</label><div id="c" class="chips"></div></div>
  <div class="f" id="kf"><label>Concepto</label><div id="k" class="chips"></div><input id="ko" type="text" placeholder="Escribí el concepto" maxlength="60" style="margin-top:8px;display:none"></div>
  <div class="f" id="xf"><label>¿Qué fue?</label><input id="xd" type="text" maxlength="60" placeholder="Ej: Cena en Kansas, zapatillas…" value=""></div>
  <div class="f" id="nf"><label>Cuotas</label><input id="n" type="number" inputmode="numeric" min="1" max="60" value="${old?.n||1}"><div class="hint">Si es en cuotas, poné arriba el valor de cada cuota: se carga sola en los meses siguientes.</div></div>
  <div class="f"><label>Quién pagó</label><div id="p"></div></div>
  <div class="f" id="wf"><label>Para quién es</label><div id="w"></div></div><div class="hint aprox" id="ainfo" style="display:none;margin:-4px 0 12px">Aproximado: no suma a ninguno de los dos, solo al total previsto del mes. Cuando se pague, tocá el gasto y elegí quién pagó.</div>
  <div class="f"><label>Fecha</label><input id="dt" type="date" value="${old?.fecha||(month===ymOf(new Date())?today():month+'-01')}"></div>
  <div class="f"><label>Nota (opcional)</label><input id="nt" type="text" maxlength="80" placeholder="Ej: Coto, compra grande" value="${esc(old?.nota||'')}"></div>
  <div class="f"><label>Foto del ticket (opcional)</label><input id="fl" type="file" accept="image/*">${ed&&old.foto?'<div class="hint">Ya tiene foto. <button class="link" id="qf" type="button">Quitar foto</button></div>':''}</div>
  <div class="acts"><button class="btn sec" id="x">Cancelar</button><button class="btn" id="ok">Guardar</button></div>
  ${ed?`<div class="acts" style="margin-top:10px">${old.foto?'<button class="btn sec" id="vf">📎 Ver foto</button>':''}<button class="btn del" id="del">Borrar${nOf(old)>1?' (todas las cuotas)':''}</button></div>`:''}`);
  const q=s=>ov.querySelector(s);
  if(ed){
    const vf=q('#vf');if(vf)vf.onclick=()=>showFoto(old.foto);
    let sure=false;q('#del').onclick=()=>{
      if(!sure){sure=true;q('#del').textContent='¿Seguro? Tocá de nuevo para borrar';return}
      write(store.del('gastos',old.id));if(old.foto)write(store.del('fotos',old.foto));ov.remove();toast('Borrado');
    };
  }
  if(tipo==='extra')q('#xd').value=concepto;
  function drawTipo(){
    const X=tipo==='extra';
    q('#kf').style.display=X?'none':'';q('#xf').style.display=X?'':'none';q('#nf').style.display=X?'':'none';
    q('#al').textContent=X?'Monto (o valor de cada cuota)':'Monto';
    seg(q('#c'),(X?XCATS:CATS).map(c=>[c.id,c.ic+' '+c.name]),cat,v=>{cat=v;if(!X){concepto='';drawK()}hint()});
    if(!X)drawK();
    q('#ok').style.background=X?'#7c3aed':'';
    hint();
  }
  seg(q('#tp'),[['fijo','🧾 Gasto fijo'],['extra','🍦 Extra']],tipo,v=>{
    if(v===tipo)return;tipo=v;cat=v==='extra'?'tarjeta':'super';
    if(v==='extra'){q('#xd').value='';}else concepto='';
    drawTipo();
  });
  function drawK(){
    const names=budgetFor(month).items.filter(i=>i.cat===cat).map(i=>i.name);
    if(concepto&&!names.includes(concepto))names.push(concepto);
    q('#ko').style.display='none';
    seg(q('#k'),[...names.map(n=>[n,esc(n)]),['__otro','✎ Otro…']],concepto||'',v=>{
      if(v==='__otro'){concepto='';q('#ko').style.display='block';q('#ko').focus();return}
      q('#ko').style.display='none';concepto=v;
      const it=budgetFor(month).items.find(i=>i.cat===cat&&i.name===v);
      if(it?.est&&!q('#a').value)q('#a').value=fmtIn(it.est);
      hint();
    });
  }
  q('#ko').oninput=()=>{concepto=q('#ko').value};
  const showA=()=>{q('#wf').style.display=pago==='A'?'none':'';q('#ainfo').style.display=pago==='A'?'':'none'};
  seg(q('#p'),[['G','Gonza'],['D','Dani'],['A','≈ Aproximado']],pago,v=>{pago=v;showA()});showA();
  seg(q('#w'),[['ambos','Ambos 50/50'],['G','Solo Gonza'],['D','Solo Dani']],para,v=>para=v);
  function hint(){
    const a=parseAmt(q('#a').value)||0,n=Math.max(1,Math.min(60,parseInt(q('#n').value)||1));
    let t='';
    if(tipo==='extra'){if(a)t=n>1?`${n} cuotas de ${money(a)} · total ${money(a*n)} · última en ${mShort(mFrom(mIdx((q('#dt').value||today()).slice(0,7))+n-1))}`:'Se carga '+money(a)}
    else{const it=budgetFor(month).items.find(i=>i.cat===cat&&i.name===concepto);t=(a?'Se carga '+money(a):'')+(it?.est?`${a?' · ':''}estimado ${money(it.est)}`:'')}
    q('#ah').textContent=t;
  }
  q('#a').oninput=hint;q('#n').oninput=hint;q('#dt').oninput=hint;
  drawTipo();
  q('#fl').onchange=()=>{fotoFile=q('#fl').files[0]||null};
  const qf=q('#qf');if(qf)qf.onclick=()=>{quitarFoto=true;qf.parentElement.textContent='Se va a quitar la foto al guardar.'};
  q('#x').onclick=()=>ov.remove();
  q('#ok').onclick=async()=>{
    const monto=parseAmt(q('#a').value);
    if(!(monto>0)){toast('Poné un monto');q('#a').focus();return}
    const X=tipo==='extra';
    const conc=((X?q('#xd').value:concepto)||'').trim()||catOf(cat).name;
    const n=X?Math.max(1,Math.min(60,parseInt(q('#n').value)||1)):1;
    const btn=q('#ok');btn.disabled=true;btn.textContent='Guardando…';
    let foto=quitarFoto?null:(old?.foto||null);
    try{
      if(fotoFile){const data=await compress(fotoFile);const fid=uid();await store.set('fotos',fid,{data,creado:new Date().toISOString()});if(old?.foto)write(store.del('fotos',old.foto));foto=fid}
      else if(quitarFoto&&old?.foto)write(store.del('fotos',old.foto));
    }catch(e){console.error(e);btn.disabled=false;btn.textContent='Guardar';toast('No se pudo subir la foto');return}
    const fecha=q('#dt').value||today();
    const doc={tipo,monto,cat,concepto:conc,pago,para,fecha,nota:q('#nt').value.trim(),por:old?.por||me,creado:old?.creado||new Date().toISOString(),...(n>1?{n}:{}),...(ed?{editado:new Date().toISOString(),editadoPor:me}:{}),...(foto?{foto}:{})};
    write(store.set('gastos',old?.id||uid(),doc));
    if(!ed&&fecha.slice(0,7)!==month)month=fecha.slice(0,7);
    ov.remove();toast((pago==='A'?'Aproximado guardado ✓':n>1?`Cargadas ${n} cuotas ✓`:'Gasto guardado ✓'));
  };
  if(!ed&&!pre.monto)setTimeout(()=>q('#a').focus(),50);
}

/* Achica la foto para que entre en la base (máx ~700 KB) */
function compress(file){
  return new Promise((res,rej)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      let max=1400,q=.72,out='';
      for(let i=0;i<8;i++){
        const s=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        out=c.toDataURL('image/jpeg',q);
        if(out.length<700000)break;
        max*=.8;q=Math.max(.45,q-.07);
      }
      URL.revokeObjectURL(url);out.length<1000000?res(out):rej(new Error('grande'));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'))};
    img.src=url;
  });
}

function exportCsv(d){
  const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
  const num=n=>String(n).replace('.',',');
  const rows=[['Fecha','Tipo','Categoría','Concepto','Cuota','Nota','Pagó','Para','Monto'].map(q).join(';')];
  [...d.L].sort((a,b)=>tipoOf(a).localeCompare(tipoOf(b))||a.fecha.localeCompare(b.fecha)).forEach(g=>rows.push([g.fecha,tipoOf(g)==='extra'?'Extra':'Fijo',catOf(g.cat).name,g.concepto,nOf(g)>1?`${g.k}/${nOf(g)}`:'',g.nota,g.pago==='A'?'Aproximado':N[g.pago],g.pago==='A'?'':g.para==='ambos'?'Ambos':N[g.para],num(g.monto)].map(q).join(';')));
  const blob=new Blob(['﻿'+rows.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`gastos-${month}.csv`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}

/* =========================================================
   5) LOGIN (solo Firebase)
   ========================================================= */
const AUTH_ERR={'auth/invalid-credential':'Email o contraseña incorrectos.','auth/wrong-password':'Contraseña incorrecta.','auth/user-not-found':'No existe esa cuenta.','auth/email-already-in-use':'Ese email ya tiene cuenta: tocá Ingresar.','auth/weak-password':'La contraseña tiene que tener al menos 6 caracteres.','auth/invalid-email':'El email no es válido.','auth/too-many-requests':'Demasiados intentos. Probá en unos minutos.','auth/network-request-failed':'Sin conexión.'};
function renderLogin(app){
  app.innerHTML=`<div style="text-align:center;margin:18px 0 14px"><img src="logo.png" alt="Nido · Finanzas del hogar" style="width:min(78vw,300px);border-radius:28px;box-shadow:0 10px 26px rgba(2,91,61,.3)"></div><div class="card"><p class="lbl" style="margin:0 0 12px;text-align:center">Ingresá con tu email</p>
  <div class="f"><label>Email</label><input id="em" type="email" autocomplete="email"></div>
  <div class="f"><label>Contraseña</label><input id="pw" type="password" autocomplete="current-password"></div>
  <button class="btn" id="in" style="width:100%;margin-bottom:8px">Ingresar</button><button class="btn sec" id="up" style="width:100%">Crear cuenta</button><div style="text-align:center"><button class="link" id="fg">Olvidé mi contraseña</button></div></div>`;
  const {A,auth}=store;const em=()=>$('#em').value.trim(),pw=()=>$('#pw').value;
  const go=async(fn,btn)=>{btn.disabled=true;try{await fn()}catch(e){toast(AUTH_ERR[e.code]||('Error: '+(e.code||e.message)))}btn.disabled=false};
  $('#in').onclick=e=>go(()=>A.signInWithEmailAndPassword(auth,em(),pw()),e.target);
  $('#up').onclick=e=>go(async()=>{const c=await A.createUserWithEmailAndPassword(auth,em(),pw());await A.sendEmailVerification(c.user);toast('Te mandamos un mail para verificar')},e.target);
  $('#fg').onclick=e=>go(async()=>{if(!em())throw{code:'auth/invalid-email'};await A.sendPasswordResetEmail(auth,em());toast('Te mandamos un mail para cambiarla')},e.target);
}
function renderVerify(app){
  app.innerHTML=`<div class="center"><div style="font-size:44px">📬</div><h2>Verificá tu email</h2><p class="lbl">Te mandamos un mail a <b>${esc(user.email)}</b>. Abrí el link y después tocá el botón. (Fijate en spam.)</p>
  <button class="btn" id="ok">Ya lo verifiqué</button><button class="btn sec" id="re">Reenviar mail</button><button class="link" id="lo">Usar otra cuenta</button></div>`;
  $('#ok').onclick=async()=>{await user.reload();await user.getIdToken(true);user=store.auth.currentUser;if(user.emailVerified){phase='app';startSubs()}else toast('Todavía no figura verificado')};
  $('#re').onclick=async()=>{try{await store.A.sendEmailVerification(user);toast('Reenviado')}catch(e){toast(AUTH_ERR[e.code]||'No se pudo reenviar')}};
  $('#lo').onclick=logout;
}
async function logout(){if(store?.auth)await store.A.signOut(store.auth)}

/* =========================================================
   6) ARRANQUE
   ========================================================= */
const unsubs=[];
function startSubs(){
  if(subsOn)return;subsOn=true;render();
  const onErr=e=>{console.error(e);phase='error';errMsg=e?.code==='permission-denied'?`La cuenta ${user?.email||''} no tiene permiso. Revisá que el email esté en las reglas de Firestore.`:'No se pudo conectar con los datos.';render()};
  const s1=store.sub('gastos',v=>{gastos=v.filter(g=>g.fecha&&g.monto);got.g=1;render()},onErr);
  const s2=store.sub('pagos',v=>{pagos=v;got.p=1;render()},onErr);
  const s3=store.sub('meses',v=>{meses=v;got.m=1;render()},onErr);
  [s1,s2,s3].forEach(u=>typeof u==='function'&&unsubs.push(u));
}
function stopSubs(){unsubs.splice(0).forEach(u=>u());subsOn=false;got={g:0,p:0,m:0};gastos=[];pagos=[];meses=[]}

(async()=>{
  render();
  if(DEMO){store=demoStore();phase='app';startSubs();return}
  try{store=await fireStore()}catch(e){console.error(e);phase='error';errMsg='No se pudo cargar Firebase. Revisá la conexión o la configuración.';render();return}
  store.A.onAuthStateChanged(store.auth,u=>{
    user=u;
    if(!u){stopSubs();phase='login'}
    else if(!u.emailVerified){stopSubs();phase='verify'}
    else{phase='app';startSubs()}
    render();
  });
})();

if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
